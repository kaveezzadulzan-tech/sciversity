{% extends 'base.html' %}
{% block title %}Admin Login – Sciversity{% endblock %}
{% block content %}
<div class="row justify-content-center" style="margin-top:60px;">
  <div class="col-md-5 col-lg-4">
    <div class="md-card">
      <div class="md-card-header header-purple justify-content-center flex-column text-center py-4">
        <div class="brand" style="font-size:1.6rem;">Sci<span>versity</span></div>
        <div style="font-size:0.85rem; opacity:0.8; margin-top:4px;">Admin Control Center</div>
      </div>
      <div class="md-card-body pt-4">
        <form method="POST">
          <div class="mb-3">
            <label style="font-size:0.85rem; font-weight:600;">Username</label>
            <input type="text" name="username" class="md-input mt-1" placeholder="admin" required/>
          </div>
          <div class="mb-4">
            <label style="font-size:0.85rem; font-weight:600;">Password</label>
            <input type="password" name="password" class="md-input mt-1" placeholder="••••••••" required/>
          </div>
          <button type="submit" class="btn-md-primary w-100 py-2" style="border-radius:12px; font-size:0.95rem;">Login as Admin</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('student_login') }}" style="color:var(--md-muted); font-size:0.82rem;">Student Login →</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
